groups:
  - name: axiom-core-safety
    interval: 15s
    rules:
      - alert: AxiomServiceUnavailable
        expr: up{job=~"api|engine-shadow|recorder|backtest-worker"} == 0
        for: 1m
        labels: { severity: critical, reason_code: persistence_failure }
        annotations:
          summary: A required Axiom process is unavailable
          runbook: docs/operations/incident-response.md#database-outage-or-leasefencing-loss
      - alert: AxiomDatabaseUnavailable
        expr: axiom_dependency_ready{dependency="postgres"} == 0
        for: 30s
        labels: { severity: critical, reason_code: persistence_failure }
        annotations:
          summary: PostgreSQL readiness failed
          runbook: docs/operations/incident-response.md#database-outage-or-leasefencing-loss
      - alert: AxiomFencingLeaseLost
        expr: axiom_dependency_ready{job="engine-shadow",dependency="fencing"} == 0
        for: 15s
        labels: { severity: critical, reason_code: fencing_lease_lost }
        annotations:
          summary: The shadow engine lost its fencing lease
          runbook: docs/operations/incident-response.md#database-outage-or-leasefencing-loss
      - alert: AxiomClockUnsafe
        expr: axiom_dependency_ready{job="engine-shadow",dependency="clock"} == 0
        for: 15s
        labels: { severity: critical, reason_code: clock_drift }
        annotations:
          summary: Clock health is outside the decision-safe bound
          runbook: docs/operations/incident-response.md#book-gap-stalecrossed-data-or-clock-anomaly
      - alert: AxiomBooksUnhealthy
        expr: axiom_dependency_ready{job="engine-shadow",dependency="books"} == 0
        for: 15s
        labels: { severity: critical, reason_code: book_unhealthy }
        annotations:
          summary: Required order books are not decision-eligible
          runbook: docs/operations/incident-response.md#book-gap-stalecrossed-data-or-clock-anomaly
      - alert: AxiomQueueDrops
        expr: increase(axiom_event_queue_dropped_total[5m]) > 0
        for: 0m
        labels: { severity: critical, reason_code: queue_saturated }
        annotations:
          summary: A bounded event queue dropped work
          runbook: docs/operations/incident-response.md#response-flow
      - alert: AxiomDiskLow
        expr: axiom_disk_free_bytes < 10737418240
        for: 5m
        labels: { severity: warning, reason_code: disk_pressure }
        annotations:
          summary: Storage is below the 10 GiB high watermark
          runbook: docs/operations/incident-response.md#disk-pressure-or-recorderstorage-failure
      - alert: AxiomDiskCritical
        expr: axiom_disk_free_bytes < 2147483648
        for: 1m
        labels: { severity: critical, reason_code: disk_critical }
        annotations:
          summary: Storage is below the 2 GiB critical watermark
          runbook: docs/operations/incident-response.md#disk-pressure-or-recorderstorage-failure
      - alert: AxiomReconciliationMismatch
        expr: increase(axiom_reconciliation_mismatches_total[5m]) > 0
        for: 0m
        labels: { severity: critical, reason_code: reconciliation_mismatch }
        annotations:
          summary: Reconciliation found a mismatch
          runbook: docs/operations/incident-response.md#journal-reservation-or-reconciliation-mismatch
      - alert: AxiomJournalFailure
        expr: increase(axiom_journal_failures_total[5m]) > 0
        for: 0m
        labels: { severity: critical, reason_code: accounting_invariant }
        annotations:
          summary: Exact journal persistence or validation failed
          runbook: docs/operations/incident-response.md#journal-reservation-or-reconciliation-mismatch
  - name: axiom-sandbox_runtime-sandbox_qualification-sandbox
    interval: 15s
    rules:
      - alert: AxiomSandboxUnknownOrder
        expr: axiom_sandbox_unknown_orders{measure="count"} > 0
        for: 30s
        labels: { severity: critical, reason_code: unresolved_unknown }
        annotations:
          summary: A test or demo order remains UNKNOWN
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox-order-recovery
      - alert: AxiomSandboxOrderIntegrityFailure
        expr: increase(axiom_sandbox_order_anomalies_total[5m]) > 0
        for: 0m
        labels: { severity: critical, reason_code: order_integrity }
        annotations:
          summary: Duplicate create, lost fill, or double-posted fill detected
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox-order-recovery
      - alert: AxiomSandboxReconciliationBlocked
        expr: axiom_sandbox_reconciliation_items{kind=~"mismatch|suspense"} > 0
        for: 0m
        labels: { severity: critical, reason_code: reconciliation_mismatch }
        annotations:
          summary: Test/demo reconciliation requires operator review
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox-reconciliation-or-account-reset
      - alert: AxiomSandboxEngineNotReady
        expr: axiom_sandbox_engine_ready == 0
        for: 30s
        labels: { severity: critical, reason_code: sandbox_engine_unready }
        annotations:
          summary: Credential-owning test/demo engine is not entry-ready
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox-engine-or-lease-failure
      - alert: AxiomSandboxEngineRestart
        expr: increase(axiom_sandbox_engine_events_total{kind="restart"}[5m]) > 0
        for: 0m
        labels: { severity: warning, reason_code: sandbox_engine_restart }
        annotations:
          summary: A test or demo engine restarted
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox-engine-or-lease-failure
      - alert: AxiomSandboxArmExpired
        expr: axiom_sandbox_arms{state="expired",measure="count"} > 0
        for: 0m
        labels: { severity: warning, reason_code: sandbox_arm_expired }
        annotations:
          summary: A sandbox arm expired and cannot authorize new entry
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox-cap-or-arm-refusal
      - alert: AxiomSandboxCapRejected
        expr: increase(axiom_sandbox_cap_rejections_total[5m]) > 0
        for: 0m
        labels: { severity: warning, reason_code: cap_violation }
        annotations:
          summary: A sandbox request was rejected by a fixed cap
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox-cap-or-arm-refusal
      - alert: AxiomSandboxAccountReset
        expr: increase(axiom_sandbox_account_resets_total{state=~"OPEN|QUARANTINED"}[5m]) > 0
        for: 0m
        labels: { severity: critical, reason_code: sandbox_account_reset }
        annotations:
          summary: A test or demo account epoch reset requires reconciliation
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox-reconciliation-or-account-reset
      - alert: AxiomSandboxQualificationFailed
        expr: axiom_sandbox_qualification_soak_state{state="FAILED"} == 1
        for: 0m
        labels: { severity: critical, reason_code: sandbox_qualification_failed }
        annotations:
          summary: sandbox qualification smoke or formal qualification terminated with failure
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox_qualification-qualification-failure
      - alert: AxiomCriticalAlertLatencySLO
        expr: histogram_quantile(0.95, sum by (le) (rate(axiom_critical_alert_latency_seconds_bucket[5m]))) > 5
        for: 5m
        labels: { severity: critical, reason_code: critical_alert_slo }
        annotations:
          summary: Critical in-app alert creation exceeds five seconds
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox_qualification-qualification-failure
      - alert: AxiomSandboxQualificationMemoryTrend
        expr: axiom_sandbox_qualification_memory_trend_bytes{window="run"} > 67108864
        for: 15m
        labels: { severity: warning, reason_code: sandbox_qualification_memory_trend }
        annotations:
          summary: sandbox qualification resident-memory trend exceeds the bounded review threshold
          runbook: docs/operations/incident-response.md#sandbox_runtime-sandbox_qualification-qualification-failure
