openapi: 3.0.3
info:
  title: Axiom V1D API
  version: 1.3.0
  description: >-
    Authenticated research, operations, audit, sandbox, and qualification
    control plane. Axiom V1 is Spot-only research software. Real trading,
    production-private order submission, and external asset movement are absent.
servers:
  - url: /
tags:
  - name: Health
  - name: Session
  - name: System
  - name: Binance
  - name: Exchanges
  - name: Opportunities
  - name: Portfolio
  - name: Inventory
  - name: Risk
  - name: Trend
  - name: Strategies
  - name: Rebalancing
  - name: Research
  - name: Reports
  - name: Backtest
  - name: Replay
  - name: Shadow
  - name: Incident
  - name: Audit
  - name: Activity
  - name: Assets
  - name: Alerts
  - name: Configuration
  - name: Exports
  - name: Qualification
  - name: Stream
paths:
  /health/live:
    get:
      operationId: getLiveness
      tags: [Health]
      summary: Report whether the process loop can respond
      responses:
        "200":
          description: Process is live
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /health/ready:
    get:
      operationId: getReadiness
      tags: [Health]
      summary: Report whether all role prerequisites are ready
      responses:
        "200":
          description: Role is ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          $ref: "#/components/responses/HealthUnavailable"
  /api/v1/session/login:
    post:
      operationId: loginSession
      tags: [Session]
      summary: Authenticate and rotate to a fresh opaque session
      parameters:
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "201":
          description: Authenticated session created
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/session/logout:
    post:
      operationId: logoutSession
      tags: [Session]
      summary: Revoke the current session and clear its cookies
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
      responses:
        "204": { description: Session revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/session/me:
    get:
      operationId: getCurrentSession
      tags: [Session]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current user and session projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionMe" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/system/version:
    get:
      operationId: getVersion
      tags: [System]
      responses:
        "200":
          description: Version identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }
  /api/v1/system/build:
    get:
      operationId: getBuildInformation
      tags: [System]
      responses:
        "200":
          description: Non-secret build identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildInformation" }
  /api/v1/system/status:
    get:
      operationId: getSystemStatus
      tags: [System]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Current fail-closed system projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/system/health:
    get:
      operationId: getDetailedHealth
      tags: [System]
      summary: Return internal redacted dependency detail on the metrics network
      security: [{ operationalBearer: [] }]
      responses:
        "200":
          description: Redacted detailed health
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailedHealthResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: A dependency is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DetailedHealthResponse" }
  /api/v1/exchanges/binance/health:
    get:
      operationId: getBinanceHealth
      tags: [Binance]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Production-public Binance health projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BinanceHealth" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/exchanges/binance/instruments:
    get:
      operationId: listBinanceInstruments
      tags: [Binance]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Deterministically ordered Spot metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstrumentPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/exchanges:
    get:
      operationId: listExchanges
      tags: [Exchanges]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Generic production-public exchange quality projections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExchangePage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/opportunities:
    get:
      operationId: listOpportunities
      tags: [Opportunities]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: kind
          schema: { type: string, enum: [triangular, cross_exchange] }
      responses:
        "200":
          description: Durable triangular and cross-exchange scanner snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/opportunities/{id}:
    get:
      operationId: getOpportunity
      tags: [Opportunities]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Multi-leg evidence, inventory impact, and recovery analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OpportunityDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/portfolios:
    get:
      operationId: listPortfolios
      tags: [Portfolio]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Virtual portfolio summaries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/portfolios/{id}:
    get:
      operationId: getPortfolio
      tags: [Portfolio]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Exact virtual balance and position projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortfolioDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/portfolios/{id}/journal:
    get:
      operationId: listPortfolioJournal
      tags: [Portfolio]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Exact immutable virtual journal page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JournalPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/inventory:
    get:
      operationId: listInventory
      tags: [Inventory]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: exchange
          schema: { type: string, maxLength: 32 }
        - in: query
          name: asset
          schema: { type: string, maxLength: 16 }
        - in: query
          name: strategy
          schema: { type: string, maxLength: 128 }
        - in: query
          name: portfolio
          schema: { type: string, maxLength: 192 }
      responses:
        "200":
          description: Isolated virtual inventory positions; never a combined balance
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/risk/status:
    get:
      operationId: getRiskStatus
      tags: [Risk]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Effective global risk state and evidence
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RiskStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/risk/pause:
    post:
      operationId: pauseRisk
      tags: [Risk]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses:
        "202":
          description: Durable pause command accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /api/v1/risk/resume:
    post:
      operationId: resumeRisk
      tags: [Risk]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses:
        "202":
          description: Policy-gated durable resume command accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/strategies/trend:
    get:
      operationId: getTrendStrategy
      tags: [Trend]
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Immutable Trend version, parameters, and evidence maturity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/strategies/trend/decisions:
    get:
      operationId: listTrendDecisions
      tags: [Trend]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: outcome
          schema: { type: string, enum: [accepted, rejected] }
      responses:
        "200":
          description: Canonical decision and rejection explanations
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TrendDecisionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/strategies:
    get:
      operationId: listStrategies
      tags: [Strategies]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Generic strategy versions, modes, evidence, and maturity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StrategyPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/rebalancing/recommendations:
    get:
      operationId: listRebalancingRecommendations
      tags: [Rebalancing]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Read-only advisory rebalancing snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RebalancingPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/rebalancing/recommendations/{id}:
    get:
      operationId: getRebalancingRecommendation
      tags: [Rebalancing]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Advisory route evidence and manual checklist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RebalancingDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/research/champion-challenger:
    get:
      operationId: listChampionChallengerReports
      tags: [Research]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Immutable research comparison reports without trading authority
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChampionChallengerPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/reports/{id}/exports:
    post:
      operationId: exportResearchReport
      tags: [Reports]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportExportRequest" }
      responses:
        "201":
          description: Immutable bounded report export created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportExportResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/backtests:
    post:
      operationId: createBacktest
      tags: [Backtest]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfflineJobRequest" }
      responses:
        "202":
          description: Durable backtest job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/backtests/{id}:
    get:
      operationId: getBacktest
      tags: [Backtest]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Backtest lifecycle, result, and reproducibility projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/replays:
    post:
      operationId: createReplay
      tags: [Replay]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayJobRequest" }
      responses:
        "202":
          description: Durable replay job accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /api/v1/replays/{id}:
    get:
      operationId: getReplay
      tags: [Replay]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - in: query
          name: event_ordinal
          description: Select one persisted canonical replay event; defaults to the newest available event.
          schema: { $ref: "#/components/schemas/Revision" }
      responses:
        "200":
          description: Replay lifecycle and deterministic cursor projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobResource" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/replays/{id}/pause:
    post:
      operationId: pauseReplay
      tags: [Replay]
      security: [{ sessionCookie: [] }]
      parameters: &replayCommandParameters
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses: &commandResponses
        "202":
          description: Durable command accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CommandAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /api/v1/replays/{id}/resume:
    post:
      operationId: resumeReplay
      tags: [Replay]
      security: [{ sessionCookie: [] }]
      parameters: *replayCommandParameters
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses: *commandResponses
  /api/v1/replays/{id}/step:
    post:
      operationId: stepReplay
      tags: [Replay]
      security: [{ sessionCookie: [] }]
      parameters: *replayCommandParameters
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses: *commandResponses
  /api/v1/replays/{id}/faults:
    get:
      operationId: listReplayFaults
      tags: [Replay]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Immutable deterministic replay fault schedule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayFaultPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: scheduleReplayFault
      tags: [Replay]
      security: [{ sessionCookie: [] }]
      parameters: *replayCommandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplayFaultRequest" }
      responses:
        "201":
          description: Fault schedule persisted before replay materialization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReplayFaultResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
  /api/v1/shadow-sessions:
    get:
      operationId: listShadowSessions
      tags: [Shadow]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/PageSize"
        - in: query
          name: state
          schema:
            type: string
            enum: [QUEUED, RUNNING, PAUSED, CANCEL_REQUESTED, CANCELED, FAILED]
      responses:
        "200":
          description: Bounded deterministic public-data shadow history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShadowSessionPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createShadowSession
      tags: [Shadow]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShadowSessionRequest" }
      responses:
        "202":
          description: Public-data simulation-only shadow session accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShadowSessionResource" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/shadow-sessions/{id}/stop:
    post:
      operationId: stopShadowSession
      tags: [Shadow]
      security: [{ sessionCookie: [] }]
      parameters: *replayCommandParameters
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses: *commandResponses
  /api/v1/shadow-sessions/{id}:
    get:
      operationId: getShadowSession
      tags: [Shadow]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
