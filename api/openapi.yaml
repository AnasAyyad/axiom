        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ReportScheduleTransitionRequest" }
      responses: *d1CommandResponses
  /api/v1/exports:
    post:
      operationId: createExport
      tags: [Exports]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExportRequest" }
      responses:
        "201":
          description: Redacted hash-sealed artifact created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportArtifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/exports/{id}:
    get:
      operationId: getExport
      tags: [Exports]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses:
        "200":
          description: Authorized redacted artifact content and metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportArtifact" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/CursorExpired" }
        "503": { $ref: "#/components/responses/Unavailable" }
    delete:
      operationId: deleteExport
      tags: [Exports]
      security: [{ sessionCookie: [] }]
      parameters: *d1CommandParameters
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses: *d1CommandResponses
  /api/v1/exports/{id}/holds:
    post:
      operationId: holdExport
      tags: [Exports]
      security: [{ sessionCookie: [] }]
      parameters: *d1CommandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtifactHoldRequest" }
      responses: *d1CommandResponses
  /api/v1/incidents/{id}/transitions:
    post:
      operationId: transitionIncident
      tags: [Incident]
      security: [{ sessionCookie: [] }]
      parameters: *d1CommandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentTransitionRequest" }
      responses: *d1CommandResponses
  /api/v1/incidents/{id}/updates:
    post:
      operationId: updateIncident
      tags: [Incident]
      security: [{ sessionCookie: [] }]
      parameters: *d1CommandParameters
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentUpdateRequest" }
      responses: *d1CommandResponses
  /api/v1/incidents/{id}/evidence-bundles:
    post:
      operationId: createIncidentEvidenceBundle
      tags: [Incident]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceBundleRequest" }
      responses:
        "201":
          description: Redacted hash-sealed seven-day incident evidence bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportArtifact" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/configuration-revisions:
    get:
      operationId: listConfigurationRevisions
      tags: [Configuration]
      security: [{ sessionCookie: [] }]
      parameters: *d1ListParameters
      responses: *d1PageResponses
    post:
      operationId: activateConfigurationRevision
      tags: [Configuration]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/ConfigurationActivationRequest" }
      responses: *d1CommandResponses
  /api/v1/lab-runs:
    get:
      operationId: listLabRuns
      tags: [Research]
      security: [{ sessionCookie: [] }]
      parameters: *d1ListParameters
      responses: *d1PageResponses
  /api/v1/lab-runs/{id}/{action}:
    post:
      operationId: controlLabRun
      tags: [Research]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
        - in: path
          name: action
          required: true
          schema: { type: string, enum: [pause, resume, cancel, reproduce] }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses: *d1CommandResponses
  /api/v1/qualifications:
    get:
      operationId: listQualifications
      tags: [Qualification]
      security: [{ sessionCookie: [] }]
      parameters: *d1ListParameters
      responses: *d1PageResponses
    post:
      operationId: startQualification
      tags: [Qualification]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/CSRFToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QualificationStartRequest" }
      responses: *d1CommandResponses
  /api/v1/qualifications/{id}/abort:
    post:
      operationId: abortQualification
      tags: [Qualification]
      security: [{ sessionCookie: [] }]
      parameters: *d1CommandParameters
      requestBody:
        $ref: "#/components/requestBodies/RevisionCommand"
      responses: *d1CommandResponses
  /api/v1/commands/{id}:
    get:
      operationId: getCommand
      tags: [System]
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/ResourceID"
      responses: *d1ResourceResponses
  /api/v1/stream:
    get:
      operationId: streamEvents
      tags: [Stream]
      summary: Resume durable operational events after a REST snapshot revision
      security: [{ sessionCookie: [] }]
      parameters:
        - $ref: "#/components/parameters/Origin"
        - in: header
          name: Last-Event-ID
          schema: { $ref: "#/components/schemas/Revision" }
        - in: query
          name: after_revision
          schema: { $ref: "#/components/schemas/Revision" }
      responses:
        "200":
          description: Versioned SSE stream with 15-second heartbeats
          content:
            text/event-stream:
              schema:
                type: string
                description: Each data field is one StreamEvent JSON object.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: Resume cursor expired; fetch fresh REST snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: axiom_session
    operationalBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    Origin:
      in: header
      name: Origin
      required: true
      schema: { type: string, format: uri, maxLength: 512 }
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string, minLength: 32, maxLength: 512 }
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        {
          type: string,
          minLength: 16,
          maxLength: 128,
          pattern: "^[A-Za-z0-9._:-]+$",
        }
    ResourceID:
      in: path
      name: id
      required: true
      schema: { type: string, minLength: 1, maxLength: 160 }
    Cursor:
      in: query
      name: cursor
      schema: { type: string, minLength: 16, maxLength: 1024 }
    PageSize:
      in: query
      name: page_size
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    FromTime:
      in: query
      name: from
      schema: { $ref: "#/components/schemas/Timestamp" }
    ToTime:
      in: query
      name: to
      schema: { $ref: "#/components/schemas/Timestamp" }
  requestBodies:
    RevisionCommand:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/RevisionCommandRequest" }
  responses:
    BadRequest:
      description: Request failed safe validation
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Authentication failed
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Authorization, Origin, or CSRF policy denied the request
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Resource not found
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Idempotency payload or lifecycle conflict
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    PreconditionFailed:
      description: Expected entity revision is stale
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Durable authentication or workload quota exceeded
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unavailable:
      description: A required fail-closed prerequisite is unavailable
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    CursorExpired:
      description: Cursor expired; fetch a fresh authoritative snapshot
      content:
        { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    HealthUnavailable:
      description: A required dependency is unavailable
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HealthResponse" }
  schemas:
    Decimal:
      type: string
      pattern: "^-?(0|[1-9][0-9]*)(\\.[0-9]+)?$"
      example: "1000.000000000000000000"
    NonnegativeDecimal:
      type: string
      pattern: "^(0|[1-9][0-9]*)(\\.[0-9]+)?$"
    Revision:
      type: string
      pattern: "^(0|[1-9][0-9]*)$"
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 timestamp with an explicit UTC offset.
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlation_id]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        message: { type: string, minLength: 1, maxLength: 240 }
        correlation_id: { type: string, minLength: 1, maxLength: 160 }
        field_details:
          type: object
          additionalProperties: { type: string, maxLength: 160 }
    Page:
      type: object
      additionalProperties: false
      required: [revision, has_more]
      properties:
        revision: { $ref: "#/components/schemas/Revision" }
        next_cursor: { type: string, minLength: 16, maxLength: 1024 }
        has_more: { type: boolean }
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, role, phase]
      properties:
        status: { type: string, enum: [live, ready, not_ready] }
        role: { type: string, minLength: 1 }
        phase: { type: string, enum: [A1, A11] }
        reason_code: { type: string, minLength: 1 }
    VersionResponse:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: string, minLength: 1 }
    BuildInformation:
      type: object
      additionalProperties: false
      required: [version, commit, built_at, go_version, dirty]
      properties:
        version: { type: string, minLength: 1 }
        commit: { type: string, minLength: 1 }
        built_at: { type: string, minLength: 1 }
        go_version: { type: string, minLength: 1 }
        dirty: { type: boolean }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, minLength: 3, maxLength: 254 }
        password:
          { type: string, minLength: 1, maxLength: 1024, writeOnly: true }
    LoginResponse:
      type: object
      additionalProperties: false
      required: [user, csrf_token, expires_at]
      properties:
        user: { $ref: "#/components/schemas/SessionUser" }
        csrf_token: { type: string, minLength: 32, maxLength: 512 }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
    SessionUser:
      type: object
      additionalProperties: false
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string, format: email }
    SessionMe:
      type: object
      additionalProperties: false
      required: [user, session_id, session_revision, reauthenticated_at]
      properties:
        user: { $ref: "#/components/schemas/SessionUser" }
        session_id: { type: string }
        session_revision: { $ref: "#/components/schemas/Revision" }
        reauthenticated_at: { $ref: "#/components/schemas/Timestamp" }
    SystemStatus:
      type: object
      additionalProperties: false
      required:
        [
          release,
          phase,
          role,
          lifecycle_state,
          strategy_activation,
          real_trading_enabled,
        ]
      properties:
        release: { type: string, enum: [V1A, V1B] }
        phase: { type: string, enum: [A1, A11, B8] }
        role: { type: string, minLength: 1 }
        lifecycle_state:
          {
            type: string,
            enum: [STARTING, READY_PAUSED, RUNNING, DEGRADED, STOPPING],
          }
        strategy_activation: { type: string, enum: [unavailable, trend.v1a.1] }
        real_trading_enabled: { type: boolean, enum: [false] }
        environment: { type: string }
        execution_mode:
          { type: string, enum: [backtest, replay, paper, shadow] }
        engine_state: { type: string }
        binance_state: { type: string }
        risk_state: { type: string, enum: [PAUSED, RESUMED, LOCKED] }
        active_resource_id: { type: string }
        critical_incidents: { type: integer, minimum: 0 }
        server_time: { $ref: "#/components/schemas/Timestamp" }
        clock_drift_ms: { type: string, pattern: "^-?(0|[1-9][0-9]*)$" }
        revision: { $ref: "#/components/schemas/Revision" }
    DetailedHealthResponse:
      type: object
      additionalProperties: false
      required:
        [status, role, lifecycle_state, real_trading_enabled, components]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        role: { type: string }
        lifecycle_state:
          {
            type: string,
            enum: [STARTING, READY_PAUSED, RUNNING, DEGRADED, STOPPING],
          }
        real_trading_enabled: { type: boolean, enum: [false] }
        components:
          type: array
          maxItems: 32
          items: { $ref: "#/components/schemas/HealthComponent" }
    HealthComponent:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          {
            type: string,
            enum:
              [
                postgres,
                authentication,
                outbox,
                public_binance,
                disk,
                recovery,
              ],
          }
        status: { type: string, enum: [ready, not_ready] }
        reason_code:
          {
            type: string,
            enum:
              [
                required_dependency_unavailable,
                bootstrap_required,
                stale,
                locked,
              ],
          }
    BinanceHealth:
      type: object
      additionalProperties: false
      required:
        [
          environment,
          public_only,
          websocket_state,
          book_state,
          recorder_state,
          revision,
          observed_at,
        ]
      properties:
        environment: { type: string, enum: [production_public] }
        public_only: { type: boolean, enum: [true] }
        capabilities: { type: array, items: { type: string }, maxItems: 16 }
        websocket_state:
          { type: string, enum: [healthy, reconnecting, degraded, stale] }
        book_state: { type: string, enum: [healthy, rebuilding, gapped, stale] }
        clock_drift_ms: { type: string, pattern: "^-?(0|[1-9][0-9]*)$" }
        gaps: { type: integer, minimum: 0 }
        rebuilds: { type: integer, minimum: 0 }
        recorder_state:
          { type: string, enum: [healthy, degraded, paused, unavailable] }
        revision: { $ref: "#/components/schemas/Revision" }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
    Instrument:
      type: object
      additionalProperties: false
      required:
        [
          id,
          symbol,
          product,
          price_tick,
          quantity_step,
          minimum_quantity,
          minimum_notional,
          metadata_version,
        ]
      properties:
        id: { type: string }
        symbol: { type: string }
        product: { type: string, enum: [spot] }
        price_tick: { $ref: "#/components/schemas/NonnegativeDecimal" }
        quantity_step: { $ref: "#/components/schemas/NonnegativeDecimal" }
        minimum_quantity: { $ref: "#/components/schemas/NonnegativeDecimal" }
        minimum_notional: { $ref: "#/components/schemas/NonnegativeDecimal" }
        metadata_version: { $ref: "#/components/schemas/Revision" }
    InstrumentPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [items]
          properties:
            items:
              {
                type: array,
                items: { $ref: "#/components/schemas/Instrument" },
              }
    QualityEvidence:
      type: object
      additionalProperties: false
      required:
        [tier, confidence, freshness, source, observed_at, provenance_complete]
      properties:
        tier:
          {
            type: string,
            enum: [formal_tier_a, local_tier_b, integration_only, unknown],
          }
        confidence:
          { type: string, enum: [high, medium, low, insufficient, unknown] }
        freshness:
          { type: string, enum: [live, fresh, stale, historical, expired] }
        source: { type: string, minLength: 1, maxLength: 192 }
        observer: { type: string, maxLength: 192 }
        observed_at: { $ref: "#/components/schemas/Timestamp" }
        expires_at: { $ref: "#/components/schemas/Timestamp" }
        provenance_complete: { type: boolean }
        warnings:
          { type: array, items: { type: string, maxLength: 500 }, maxItems: 64 }
    ExchangeSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          environment,
          public_only,
          websocket_state,
          book_state,
          recorder_state,
          capabilities,
          instruments,
          quality,
          revision,
        ]
      properties:
        id: { type: string }
        name: { type: string }
        environment: { type: string, enum: [production_public] }
        public_only: { type: boolean, enum: [true] }
        websocket_state:
          { type: string, enum: [healthy, reconnecting, degraded, stale] }
        book_state: { type: string, enum: [healthy, rebuilding, gapped, stale] }
        recorder_state:
          { type: string, enum: [healthy, degraded, paused, unavailable] }
        capabilities: { type: array, items: { type: string }, maxItems: 32 }
        instruments: { type: integer, minimum: 0 }
        last_message_age_ms: { $ref: "#/components/schemas/Revision" }
        sequence_gaps: { type: integer, minimum: 0 }
        reconnects: { type: integer, minimum: 0 }
        quality: { $ref: "#/components/schemas/QualityEvidence" }
        revision: { $ref: "#/components/schemas/Revision" }
    ExchangePage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [snapshot_revision, items]
          properties:
            snapshot_revision: { $ref: "#/components/schemas/Revision" }
            items:
              {
                type: array,
                items: { $ref: "#/components/schemas/ExchangeSummary" },
              }
    OpportunitySummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          label,
          strategy_version,
          tested_size,
          maximum_size,
          gross_metric,
          net_metric,
          expected_profit,
          worst_case_profit,
          status,
          simulation_only,
          quality,
          recorded_at,
          revision,
        ]
      properties:
        id: { type: string }
        kind: { type: string, enum: [triangular, cross_exchange] }
        label: { type: string }
        instrument: { type: string }
        cycle_path:
          { type: array, items: { type: string }, minItems: 2, maxItems: 8 }
        strategy_version: { type: string }
        buy_exchange: { type: string }
        sell_exchange: { type: string }
        exchange: { type: string }
        tested_size: { $ref: "#/components/schemas/NonnegativeDecimal" }
        maximum_size: { $ref: "#/components/schemas/NonnegativeDecimal" }
        gross_metric: { $ref: "#/components/schemas/Decimal" }
        net_metric: { $ref: "#/components/schemas/Decimal" }
        expected_profit: { $ref: "#/components/schemas/Decimal" }
        worst_case_profit: { $ref: "#/components/schemas/Decimal" }
        opportunity_age_nanos: { $ref: "#/components/schemas/Revision" }
        lifetime_nanos: { $ref: "#/components/schemas/Revision" }
        status:
          {
            type: string,
            enum:
              [
                detected,
                qualified,
                simulated,
                recovery_required,
                quarantined,
                rejected,
                expired,
              ],
          }
        simulation_only: { type: boolean, enum: [true] }
        quality: { $ref: "#/components/schemas/QualityEvidence" }
        recorded_at: { $ref: "#/components/schemas/Timestamp" }
        revision: { $ref: "#/components/schemas/Revision" }
    OpportunityPage:
      allOf:
        - $ref: "#/components/schemas/Page"
        - type: object
          required: [snapshot_revision, items]
          properties:
            snapshot_revision: { $ref: "#/components/schemas/Revision" }
            items:
              {
                type: array,
                items: { $ref: "#/components/schemas/OpportunitySummary" },
              }
    OpportunityLeg:
      type: object
      additionalProperties: false
      required:
        [
          index,
          exchange,
          instrument,
          side,
          input_quantity,
          trade_quantity,
          gross_output,
          net_output,
          fee_asset,
          fee_quantity,
          fee_quote_equivalent,
          vwap,
          depth_cost,
          state,
          revision,
        ]
      properties:
        index: { type: integer, minimum: 0, maximum: 7 }
        exchange: { type: string }
        instrument: { type: string }
        side: { type: string, enum: [buy, sell] }
        source_asset: { type: string }
        target_asset: { type: string }
        input_quantity: { $ref: "#/components/schemas/NonnegativeDecimal" }
        trade_quantity: { $ref: "#/components/schemas/NonnegativeDecimal" }
        gross_output: { $ref: "#/components/schemas/NonnegativeDecimal" }
        net_output: { $ref: "#/components/schemas/NonnegativeDecimal" }
        fee_asset: { type: string }
        fee_quantity: { $ref: "#/components/schemas/NonnegativeDecimal" }
        fee_quote_equivalent:
          { $ref: "#/components/schemas/NonnegativeDecimal" }
        vwap: { $ref: "#/components/schemas/NonnegativeDecimal" }
        depth_cost: { $ref: "#/components/schemas/NonnegativeDecimal" }
        arrival_offset_nanos: { $ref: "#/components/schemas/Revision" }
        state: { type: string }
        revision: { $ref: "#/components/schemas/Revision" }
    InventoryImpact:
      type: object
      additionalProperties: false
      required:
        [exchange, asset, before, after, band_state, natural_reverse_preferred]
      properties:
