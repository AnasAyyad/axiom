name: Axiom CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.26.5
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.12.0

jobs:
  quality:
    name: Format, lint, test, contracts, and safety
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install required runner tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit locked JavaScript dependency graph
        run: pnpm audit --audit-level=moderate
      - name: Run local-equivalent quality gate
        run: make verify

  release_certification-certification:
    name: release certification fail-closed certification and traceability
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Validate certification model and complete traceability
        run: make release-certification-model-qualify release-certification-traceability-qualify
      - name: Prove final certification remains default-off
        run: |
          if make release-certification-formal; then
            echo "default-off certification unexpectedly passed" >&2
            exit 1
          fi

  owner_experience-browser:
    name: owner experience Chromium, Firefox, WebKit, tablet, and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser runtimes
        run: pnpm --filter @axiom/web exec playwright install --with-deps chromium firefox webkit
      - name: Run owner experience browser matrix
        run: make owner-experience-browser-qualify

  run_lab-browser:
    name: run lab labs in Chromium, Firefox, WebKit, tablet, and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser runtimes
        run: pnpm --filter @axiom/web exec playwright install --with-deps chromium firefox webkit
      - name: Run run lab browser matrix
        run: make run-lab-browser-qualify

  operational_evidence-browser:
    name: operational evidence operations in Chromium, Firefox, WebKit, tablet, and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack install --global pnpm@${PNPM_VERSION}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned browser runtimes
        run: pnpm --filter @axiom/web exec playwright install --with-deps chromium firefox webkit
      - name: Run operational evidence browser matrix
        run: make operational-evidence-browser-qualify

  operational_evidence-postgres:
    name: operational evidence PostgreSQL clean-install and owner control upgrade qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Create isolated operational evidence qualification databases
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "${POSTGRES_SERVICE_ID}" createdb --username postgres axiom_operational_evidence_clean_operational_evidence_test
          docker exec "${POSTGRES_SERVICE_ID}" createdb --username postgres axiom_operational_evidence_upgrade_operational_evidence_test
      - name: Run operational evidence clean-install and exact owner control upgrade qualification
        env:
          AXIOM_OPERATIONAL_EVIDENCE_TEST_DSN: postgresql://postgres@127.0.0.1:5432/axiom_operational_evidence_clean_operational_evidence_test?sslmode=disable
          AXIOM_OPERATIONAL_EVIDENCE_UPGRADE_TEST_DSN: postgresql://postgres@127.0.0.1:5432/axiom_operational_evidence_upgrade_operational_evidence_test?sslmode=disable
        run: make operational-evidence-postgres-qualify

  operational_readiness-postgres:
    name: operational readiness PostgreSQL clean-install and operational evidence upgrade qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Create isolated operational readiness qualification databases
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "${POSTGRES_SERVICE_ID}" createdb --username postgres axiom_operational_readiness_clean_operational_readiness_test
          docker exec "${POSTGRES_SERVICE_ID}" createdb --username postgres axiom_operational_readiness_upgrade_operational_readiness_test
      - name: Run operational readiness clean-install and exact operational evidence upgrade qualification
        env:
          AXIOM_OPERATIONAL_READINESS_TEST_DSN: postgresql://postgres@127.0.0.1:5432/axiom_operational_readiness_clean_operational_readiness_test?sslmode=disable
          AXIOM_OPERATIONAL_READINESS_UPGRADE_TEST_DSN: postgresql://postgres@127.0.0.1:5432/axiom_operational_readiness_upgrade_operational_readiness_test?sslmode=disable
        run: make operational-readiness-postgres-qualify

  evaluation_campaign-postgres:
    name: evaluation campaign PostgreSQL clean-install and migration-54 upgrade qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Create isolated evaluation campaign qualification databases
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "${POSTGRES_SERVICE_ID}" createdb --username postgres axiom_evaluation_clean_evaluation_campaign_test
          docker exec "${POSTGRES_SERVICE_ID}" createdb --username postgres axiom_evaluation_upgrade_evaluation_campaign_test
      - name: Run evaluation campaign clean-install and migration-54 upgrade qualification
        env:
          AXIOM_EVALUATION_CAMPAIGN_TEST_DSN: postgresql://postgres@127.0.0.1:5432/axiom_evaluation_clean_evaluation_campaign_test?sslmode=disable
          AXIOM_EVALUATION_CAMPAIGN_UPGRADE_TEST_DSN: postgresql://postgres@127.0.0.1:5432/axiom_evaluation_upgrade_evaluation_campaign_test?sslmode=disable
        run: make evaluation-campaign-postgres-qualify

  operational_readiness-local:
    name: operational readiness pressure, backup, lifecycle, chaos, and smoke gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Run non-server operational readiness gates
        run: |
          make operational-readiness-model-qualify
          make operational-readiness-backup-qualify
          make operational-readiness-hardening-qualify
          make operational-readiness-chaos-qualify
          make operational-readiness-smoke

  postgres-smoke:
    name: PostgreSQL readiness and process smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: axiom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axiom"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Provision least-privilege smoke roles
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          for role in \
            axiom_app \
            axiom_recorder \
            axiom_readonly \
            axiom_binance_engine \
            axiom_bybit_engine \
            axiom_sandbox_qualification; do
            docker exec "${POSTGRES_SERVICE_ID}" psql \
              --username postgres --dbname axiom --set=ON_ERROR_STOP=1 \
              --command "CREATE ROLE ${role} NOLOGIN"
          done
      - name: Run all platform command forms and health transitions
        env:
          AXIOM_SMOKE_DB_HOST: 127.0.0.1
          AXIOM_SMOKE_DB_PORT: "5432"
          AXIOM_SMOKE_DB_USER: postgres
          AXIOM_SMOKE_DB_NAME: axiom
        run: tests/integration/smoke-platform.sh

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Reject vulnerable or disallowed dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          license-check: true
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-2-Clause-Views, BSD-3-Clause, ISC, MIT, MIT-0, MPL-2.0, PostgreSQL, 0BSD, CC-BY-4.0, CC0-1.0, BlueOak-1.0.0, LicenseRef-scancode-google-patent-license-golang, Unlicense

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Add a scan boundary for root commits
        shell: bash
        run: |
          empty_tree="$(git mktree </dev/null)"
          synthetic_parent="$({
            printf 'Synthetic empty parent for the CI secret-scan boundary\n'
          } | git -c user.name='Axiom CI' -c user.email='ci@invalid.example' \
            commit-tree "${empty_tree}")"
          while IFS= read -r root_commit; do
            git replace --graft "${root_commit}" "${synthetic_parent}"
          done < <(git rev-list --max-parents=0 HEAD)
      - name: Scan with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: Image, clean deployment, SBOM, license, and vulnerability gates
    needs: [quality, postgres-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install required runner tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build immutable candidate input
        run: >-
          make image IMAGE=axiom:ci VERSION=0.1.0-ci COMMIT=${GITHUB_SHA}
          BUILT_AT=ci DIRTY=false
      - name: Build backup and restore candidate
        run: make backup-image BACKUP_IMAGE=axiom-backup:ci
      - name: Inspect non-root minimal runtime
        run: |
          scripts/inspect-image.sh axiom:ci
          scripts/inspect-backup-image.sh axiom-backup:ci
      - name: Prove reproducible runtime payloads
        run: |
          mkdir -p artifacts
          make image-reproducibility IMAGE=axiom:ci REBUILD_IMAGE=axiom:ci-rebuild \
            VERSION=0.1.0-ci COMMIT=${GITHUB_SHA} BUILT_AT=ci DIRTY=false | \
            tee artifacts/image-reproducibility.txt
          make backup-image-reproducibility BACKUP_IMAGE=axiom-backup:ci | \
            tee artifacts/backup-image-reproducibility.txt
      - name: Walk through image-backed application setup
        run: make compose-smoke IMAGE=axiom:ci
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: axiom:ci
          format: spdx-json
          output-file: artifacts/axiom.spdx.json
      - name: Generate backup image SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: axiom-backup:ci
          format: spdx-json
          output-file: artifacts/axiom-backup.spdx.json
      - name: Scan image vulnerabilities, secrets, misconfiguration, and licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: axiom:ci
          format: sarif
          output: artifacts/trivy.sarif
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
      - name: Scan backup image vulnerabilities, secrets, misconfiguration, and licenses
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: axiom-backup:ci
          format: sarif
          output: artifacts/trivy-backup.sarif
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: "1"
      - name: Record image digest
        run: |
          docker image inspect --format '{{.Id}}' axiom:ci > artifacts/image-digest.txt
          docker image inspect --format '{{.Id}}' axiom-backup:ci > artifacts/backup-image-digest.txt
      - name: Require existing private GHCR package metadata
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api /users/AnasAyyad/packages/container/axiom --jq .visibility)" = private
          test "$(gh api /users/AnasAyyad/packages/container/axiom-backup --jq .visibility)" = private
      - name: Refuse publication to public GHCR packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          scripts/assert-ghcr-not-public.sh anasayyad/axiom
          scripts/assert-ghcr-not-public.sh anasayyad/axiom-backup
      - name: Authenticate to private GHCR on merged main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install pinned Cosign on merged main only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish immutable commit-tagged images
        id: publish
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_IMAGE: ghcr.io/anasayyad/axiom:${{ github.sha }}
          BACKUP_IMAGE: ghcr.io/anasayyad/axiom-backup:${{ github.sha }}
        run: |
          docker tag axiom:ci "${APP_IMAGE}"
          docker tag axiom-backup:ci "${BACKUP_IMAGE}"
          docker push "${APP_IMAGE}"
          docker push "${BACKUP_IMAGE}"
          docker buildx imagetools inspect "${APP_IMAGE}" \
            --format '{{json .Manifest}}' > artifacts/ghcr-axiom-manifest.json
          docker buildx imagetools inspect "${BACKUP_IMAGE}" \
            --format '{{json .Manifest}}' > artifacts/ghcr-axiom-backup-manifest.json
          app_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' artifacts/ghcr-axiom-manifest.json)"
          backup_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' artifacts/ghcr-axiom-backup-manifest.json)"
          printf 'app_digest=%s\n' "${app_digest}" >> "${GITHUB_OUTPUT}"
          printf 'backup_digest=%s\n' "${backup_digest}" >> "${GITHUB_OUTPUT}"
          printf 'APP_IMAGE=ghcr.io/anasayyad/axiom@%s\nBACKUP_IMAGE=ghcr.io/anasayyad/axiom-backup@%s\n' \
            "${app_digest}" "${backup_digest}" > artifacts/published-images.env
      - name: Verify published digests remain private
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_DIGEST: ${{ steps.publish.outputs.app_digest }}
          BACKUP_DIGEST: ${{ steps.publish.outputs.backup_digest }}
        run: |
          scripts/assert-ghcr-not-public.sh anasayyad/axiom "${APP_DIGEST}"
          scripts/assert-ghcr-not-public.sh anasayyad/axiom-backup "${BACKUP_DIGEST}"
      - name: Sign immutable image digests with keyless OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          APP_DIGEST: ${{ steps.publish.outputs.app_digest }}
          BACKUP_DIGEST: ${{ steps.publish.outputs.backup_digest }}
        run: |
          cosign sign --yes "ghcr.io/anasayyad/axiom@${APP_DIGEST}"
          cosign sign --yes "ghcr.io/anasayyad/axiom-backup@${BACKUP_DIGEST}"
          cosign verify \
            --certificate-identity-regexp '(?i)^https://github[.]com/anasayyad/axiom/[.]github/workflows/ci[.]yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/anasayyad/axiom@${APP_DIGEST}" > artifacts/cosign-axiom-verification.json
          cosign verify \
            --certificate-identity-regexp '(?i)^https://github[.]com/anasayyad/axiom/[.]github/workflows/ci[.]yml@refs/heads/main$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/anasayyad/axiom-backup@${BACKUP_DIGEST}" > artifacts/cosign-axiom-backup-verification.json
      - name: Attest application build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/anasayyad/axiom
          subject-digest: ${{ steps.publish.outputs.app_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest backup build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/anasayyad/axiom-backup
          subject-digest: ${{ steps.publish.outputs.backup_digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest application SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/anasayyad/axiom
          subject-digest: ${{ steps.publish.outputs.app_digest }}
          sbom-path: artifacts/axiom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Attest backup SBOM
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/anasayyad/axiom-backup
          subject-digest: ${{ steps.publish.outputs.backup_digest }}
          sbom-path: artifacts/axiom-backup.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application_baseline-supply-chain-evidence
          path: artifacts/
          if-no-files-found: error
