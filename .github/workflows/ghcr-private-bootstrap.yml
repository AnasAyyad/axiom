name: One-time private GHCR bootstrap

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type delete-public-packages-31515133196
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  GO_VERSION: 1.26.5
  EXPECTED_APP_VERSION_IDS: 1122012154,1122012805,1122012824,1122013555,1122013575,1122014198,1122014221
  EXPECTED_BACKUP_VERSION_IDS: 1122012436,1122013121,1122013152,1122013947,1122013977,1122014495,1122014515
  EXPECTED_APP_DIGEST: sha256:b1d58be9458d1e57c6d788bc8c0c7260d69cfe2b0aad917cc62b9b5c2d5b3352
  EXPECTED_BACKUP_DIGEST: sha256:3ebd3400df3b0a297dd8e68e1ea3ade0efeef8c4b3e32a138d2eda1522e61706

jobs:
  bootstrap:
    name: Replace exact public packages with private namespaces
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the exact main recovery request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "${GITHUB_REF}" = refs/heads/main
          test "${CONFIRMATION}" = delete-public-packages-31515133196
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build current main recovery candidates
        run: |
          make image IMAGE=axiom:private-bootstrap VERSION=0.1.0-ci \
            COMMIT=${GITHUB_SHA} BUILT_AT=ci DIRTY=false
          make backup-image BACKUP_IMAGE=axiom-backup:private-bootstrap
          scripts/inspect-image.sh axiom:private-bootstrap
          scripts/inspect-backup-image.sh axiom-backup:private-bootstrap
      - name: Authenticate the repository-scoped publisher
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify the exact disposable public package inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api /users/AnasAyyad/packages/container/axiom --jq .visibility)" = public
          test "$(gh api /users/AnasAyyad/packages/container/axiom-backup --jq .visibility)" = public

          app_ids="$(gh api --paginate '/users/AnasAyyad/packages/container/axiom/versions?per_page=100' \
            --jq '.[].id' | sort -n | paste -sd, -)"
          backup_ids="$(gh api --paginate '/users/AnasAyyad/packages/container/axiom-backup/versions?per_page=100' \
            --jq '.[].id' | sort -n | paste -sd, -)"
          test "${app_ids}" = "${EXPECTED_APP_VERSION_IDS}"
          test "${backup_ids}" = "${EXPECTED_BACKUP_VERSION_IDS}"

          test "$(docker buildx imagetools inspect \
            ghcr.io/anasayyad/axiom:54375a41693a6f8d620a079e8b0c62b5c86d6235 \
            --format '{{json .Manifest}}' | jq -er .digest)" = "${EXPECTED_APP_DIGEST}"
          test "$(docker buildx imagetools inspect \
            ghcr.io/anasayyad/axiom-backup:54375a41693a6f8d620a079e8b0c62b5c86d6235 \
            --format '{{json .Manifest}}' | jq -er .digest)" = "${EXPECTED_BACKUP_DIGEST}"
      - name: Recreate the allowlisted packages and prove private access
        id: recreate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_IMAGE: ghcr.io/anasayyad/axiom:${{ github.sha }}
          BACKUP_IMAGE: ghcr.io/anasayyad/axiom-backup:${{ github.sha }}
        run: |
          cleanup_new_packages() {
            gh api --method DELETE /users/AnasAyyad/packages/container/axiom >/dev/null 2>&1 || true
            gh api --method DELETE /users/AnasAyyad/packages/container/axiom-backup >/dev/null 2>&1 || true
          }
          cleanup_on_error() {
            status=$?
            if (( status != 0 )); then
              cleanup_new_packages
            fi
            exit "${status}"
          }
          trap cleanup_on_error EXIT

          gh api --method DELETE /users/AnasAyyad/packages/container/axiom
          gh api --method DELETE /users/AnasAyyad/packages/container/axiom-backup
          scripts/assert-ghcr-not-public.sh anasayyad/axiom
          scripts/assert-ghcr-not-public.sh anasayyad/axiom-backup

          docker tag axiom:private-bootstrap "${APP_IMAGE}"
          docker tag axiom-backup:private-bootstrap "${BACKUP_IMAGE}"
          docker push "${APP_IMAGE}"
          docker push "${BACKUP_IMAGE}"

          mkdir -p artifacts
          docker buildx imagetools inspect "${APP_IMAGE}" \
            --format '{{json .Manifest}}' > artifacts/ghcr-axiom-bootstrap-manifest.json
          docker buildx imagetools inspect "${BACKUP_IMAGE}" \
            --format '{{json .Manifest}}' > artifacts/ghcr-axiom-backup-bootstrap-manifest.json
          app_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            artifacts/ghcr-axiom-bootstrap-manifest.json)"
          backup_digest="$(jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))' \
            artifacts/ghcr-axiom-backup-bootstrap-manifest.json)"
          scripts/assert-ghcr-not-public.sh anasayyad/axiom "${app_digest}"
          scripts/assert-ghcr-not-public.sh anasayyad/axiom-backup "${backup_digest}"
          printf 'APP_IMAGE=ghcr.io/anasayyad/axiom@%s\nBACKUP_IMAGE=ghcr.io/anasayyad/axiom-backup@%s\n' \
            "${app_digest}" "${backup_digest}" > artifacts/private-bootstrap-images.env
          trap - EXIT
      - name: Upload private bootstrap evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ghcr-private-bootstrap-evidence
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
